# =============================================================
# Spring Boot Configuration — ContentOS Core Backend
# =============================================================

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: backend-core

  # Database Connection Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contentos_db}
    username: ${DB_USERNAME:contentos_user}
    password: ${DB_PASSWORD:contentos_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA & Hibernate Settings
  jpa:
    open-in-view: false   # Disable OSIV to avoid accidental lazy loading in view layer
    hibernate:
      ddl-auto: validate  # NEVER use create-drop or update in production — Flyway handles schema
    show-sql: false       # Set to true for debugging queries
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Database Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:contentos_redis_pass}
      timeout: 2000ms

# =============================================================
# Application Specific Properties
# =============================================================

app:
  # JWT Token Configuration
  jwt:
    # Key must be at least 64 hex characters (256-bit secret)
    secret: ${JWT_SECRET:404e635266556a586e3272357538782f413f4428472b4b6250645367566b5970}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days by default

  # S3 / MinIO Object Storage Configuration
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket-name: ${S3_BUCKET:contentos-media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

  # AI Engine Integration
  ai-engine:
    base-url: ${AI_ENGINE_URL:http://localhost:8000}
    webhook-secret: ${INTERNAL_WEBHOOK_SECRET:internal-secret-token-change-in-prod}

  # Security & CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =============================================================
# OpenAPI / Swagger Documentation
# =============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
