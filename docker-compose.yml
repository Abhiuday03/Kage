version: "3.9"

# =============================================================
# ContentOS - Local Development Infrastructure
# =============================================================
# Services:
#   postgres  → Relational database (all business data)
#   redis     → Cache, job queue, pub/sub
#   minio     → S3-compatible local object storage (media files)
#
# Usage:
#   docker compose up -d         → Start everything in background
#   docker compose down          → Stop all containers
#   docker compose down -v       → Stop + delete all volumes (clean slate)
#
# After startup:
#   PostgreSQL → localhost:5432
#   Redis      → localhost:6379
#   MinIO API  → localhost:9000
#   MinIO UI   → localhost:9001 (login: minioadmin / minioadmin)
# =============================================================

services:

  # ----- PostgreSQL 16 ----------------------------------------
  # Stores ALL business data: users, workspaces, content, jobs, etc.
  postgres:
    image: postgres:16-alpine
    container_name: contentos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: contentos_db
      POSTGRES_USER: contentos_user
      POSTGRES_PASSWORD: contentos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos_user -d contentos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- Redis 7 -----------------------------------------------
  # Used for:
  #   - Background job queues (image/video generation tasks)
  #   - Caching (user sessions, tenant data, expensive queries)
  #   - Pub/Sub (real-time job status notifications)
  #   - Rate limiting counters
  redis:
    image: redis:7-alpine
    container_name: contentos_redis
    restart: unless-stopped
    command: redis-server --requirepass contentos_redis_pass --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "contentos_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- MinIO (S3-compatible object storage) ------------------
  # Stores ALL media: generated images, videos, MP4 reels, audio files.
  # In production, replace with AWS S3 or Cloudflare R2.
  # The application code never needs to change — only the environment
  # variables change (S3_ENDPOINT, S3_BUCKET, etc.)
  minio:
    image: minio/minio:latest
    container_name: contentos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API endpoint (the app connects here)
      - "9001:9001"   # MinIO web console (browse uploads visually)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----- MinIO bucket initialization --------------------------
  # This runs ONCE on first startup to create the default media bucket.
  # Runs after MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: contentos_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/contentos-media;
      /usr/bin/mc anonymous set none local/contentos-media;
      echo 'MinIO bucket contentos-media created successfully';
      exit 0;
      "
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
